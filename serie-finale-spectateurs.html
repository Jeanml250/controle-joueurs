<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Série finale - Résultats</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      width: 100%;
      min-height: 100%;
    }

    #resultats {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <img id="resultats"
       src="resultats.png"
       alt="Résultats de la série finale">

  <script>
    const imageAffichee = document.getElementById("resultats");
    let chargementEnCours = false;

    function actualiserResultats() {
      if (chargementEnCours) return;

      chargementEnCours = true;

      const nouvelleImage = new Image();

      nouvelleImage.onload = function () {
        imageAffichee.src = nouvelleImage.src;
        chargementEnCours = false;
      };

      nouvelleImage.onerror = function () {
        chargementEnCours = false;
      };

      nouvelleImage.src =
        "resultats.png?t=" + Date.now();
    }

    setInterval(actualiserResultats, 2000);
  </script>

</body>
</html>
